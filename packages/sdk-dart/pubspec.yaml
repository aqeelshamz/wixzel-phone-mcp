name: wixzel_phone
description: Official Dart SDK for the Wixzel Phone API. AI voice agents that place and answer real phone calls over your own SIP trunk, from Dart and Flutter.
version: 0.1.0
repository: https://github.com/aqeelshamz/wixzel-phone-sdks
homepage: https://phone.wixzel.com
documentation: https://docs.phone.wixzel.com/sdks
issue_tracker: https://github.com/aqeelshamz/wixzel-phone-sdks/issues
topics:
  - voice
  - telephony
  - ai
  - api
  - sdk

environment:
  sdk: ^3.5.0

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0

# The npm-workspace shim is repo plumbing, not part of the package.
false_secrets:
  - /package.json
